name: ${PROJECT_NAME}-go

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    container_name: ${PROJECT_NAME}-go-app
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:${GRPC_PORT:-50051}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - template-network

networks:
  template-network:
    external: true
    name: ${PROJECT_NAME}-network
